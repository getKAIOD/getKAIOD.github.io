<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIOD Project | Next-Gen Bot Systems</title>
    
    <!-- Google Fonts (Düzeltildi ve optimize edildi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: radial-gradient(circle at top, #161224 0%, #0b0914 100%); 
            color: #f3f4f6; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
            animation: fadeIn 1.2s ease-out;
        }
        
        /* Arka Plan Işık Efekti (Daha yumuşak) */
        body::before { 
            content: ''; 
            position: absolute; 
            width: 500px; 
            height: 500px; 
            background: #00ff88; 
            filter: blur(200px); 
            top: -150px; 
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.1; 
            pointer-events: none; 
            z-index: -1;
        }

        /* Ana Kart (Yumuşak animasyon) */
        .container { 
            background: rgba(18, 16, 26, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(20px); 
            padding: 50px 40px; 
            border-radius: 28px; 
            text-align: center; 
            max-width: 550px; 
            width: 90%; 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); 
            position: relative; 
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        /* Proje Başlığı (Neon Efekti) */
        .logo-title { 
            font-size: 3.5rem; 
            font-weight: 800; 
            letter-spacing: -2px; 
            margin-bottom: 10px; 
            background: linear-gradient(135deg, #00ff88 0%, #00bfff 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0 0 50px rgba(0, 255, 136, 0.3); 
        }
        
        .tagline { 
            color: #9ca3af; 
            font-size: 1.1rem; 
            margin-bottom: 35px; 
            font-weight: 400; 
            line-height: 1.6; 
        }
        
        /* Özellik Kartları */
        .features { 
            display: grid; 
            gap: 12px; 
            margin-bottom: 35px; 
            text-align: left; 
        }
        
        .feature-item { 
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 14px 20px; 
            border-radius: 14px; 
            font-size: 0.95rem; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: #cbd5e1; 
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .feature-item span { 
            color: #00ff88; 
            font-weight: bold; 
        }

        /* Havalı Buton */
        .btn-showcase { 
            display: inline-block; 
            width: 100%; 
            padding: 16px 32px; 
            background: linear-gradient(135deg, #00ff88 0%, #02c39a 100%); 
            color: #05050a; 
            font-weight: 700; 
            font-size: 1.05rem; 
            text-decoration: none; 
            border-radius: 14px; 
            transition: all 0.3s ease; 
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.25); 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        .btn-showcase:hover { 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 0 45px rgba(0, 255, 136, 0.5); 
            filter: brightness(1.1); 
        }
        
        /* Alt Bilgi */
        .footer { 
            margin-top: 30px; 
            font-size: 0.8rem; 
            color: #4b5563; 
            letter-spacing: 1.5px; 
        }

        /* Animasyonlar */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="logo-title">KAIOD</h1>
        <p class="tagline">The Ultimate Roblox Baseplate Script</p>
        
        <div class="features">
            <div class="feature-item">⚡ <span>Speed:</span> Optimized. Never Get Lags!</div>
            <div class="feature-item">🤖 <span>Kill Speed:</span> Customizable Kill Speed!</div>
            <div class="feature-item">💻 <span>Modern UI:</span> Keyless & User-Friendly!</div>
        </div>

        <!-- href kısmını kendi github adresinle değiştirebilirsin -->
        <a href="https://github.com" target="_blank" class="btn-showcase">Explore Projects</a>
        
        <div class="footer">© 2026 PACKETSTORM PROJECTS</div>
    </div>

</body>
</html>
