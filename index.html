<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIOD | Just A Baseplate</title>
    
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        
        body { 
            background: #05050a; 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
            position: relative;
        }

        /* GetWave tarzı Grid Arka Plan */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            mask-image: radial-gradient(circle at center, black 30%, transparent 100%);
        }

        /* Neon Işıklar */
        .glow-green {
            position: absolute;
            width: 500px; height: 500px;
            background: rgba(0, 255, 136, 0.1);
            filter: blur(150px);
            top: 10%; left: 20%;
            border-radius: 50%;
            z-index: -1;
            animation: pulse 6s infinite alternate;
        }
        .glow-blue {
            position: absolute;
            width: 400px; height: 400px;
            background: rgba(0, 191, 255, 0.1);
            filter: blur(120px);
            bottom: 0; right: 10%;
            border-radius: 50%;
            z-index: -1;
            animation: pulse 8s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Ana Kart */
        .container { 
            background: rgba(12, 12, 18, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            padding: 60px 50px; 
            border-radius: 28px; 
            text-align: center; 
            max-width: 650px; 
            width: 90%; 
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8); 
            position: relative; 
            z-index: 10;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Neon Başlık */
        h1 { 
            font-size: 4rem; 
            font-weight: 800; 
            letter-spacing: -1px; 
            margin-bottom: 5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ff88, #00e5ff, #00ff88);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            color: #a1a1aa;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .description {
            color: #d4d4d8;
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        /* Ana Buton (GetWave Tarzı) */
        .btn-main { 
            display: inline-block; 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, #00ff88 0%, #00e5ff 100%); 
            color: #050508; 
            font-weight: 800; 
            font-size: 1.1rem; 
            text-decoration: none; 
            border-radius: 16px; 
            transition: all 0.3s ease; 
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 35px;
            border: none;
            cursor: pointer;
        }
        
        .btn-main:hover { 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.6), 0 0 100px rgba(0, 229, 255, 0.4); 
            filter: brightness(1.1);
        }

        /* Özellik Kutuları */
        .features { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; 
        }
        
        .feature-item { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 20px 15px; 
            border-radius: 18px; 
            font-size: 0.9rem; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            color: #a1a1aa; 
            transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 136, 0.6);
            background: rgba(0, 255, 136, 0.05);
            color: #fff;
        }

        .feature-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.5));
        }

        .feature-item span { 
            color: #00ff88; 
            font-weight: 800; 
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Alt Bilgi */
        .footer { 
            margin-top: 40px; 
            font-size: 0.8rem; 
            color: #52525b; 
            letter-spacing: 2px; 
            text-transform: uppercase;
        }

        /* Mobil uyum */
        @media (max-width: 600px) {
            .container { padding: 40px 20px; }
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 0.8rem; }
            .features { grid-template-columns: 1fr; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="glow-green"></div>
    <div class="glow-blue"></div>

    <div class="container">
        <h1>KAIOD</h1>
        <p class="subtitle">Just A Baseplate</p>
        
        <p class="description">
            The Ultimate Next-Gen Bot System for Roblox.<br>
            Fast, Keyless, and Packed with features.
        </p>

        <!-- Linki kendi GitHub'ınla değiştir -->
        <a href="https://github.com" target="_blank" class="btn-main">Get KAIOD</a>
        
        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">⚡</div>
                <span>Speed</span>
                Never Get Lags!
            </div>
            <div class="feature-item">
                <div class="feature-icon">🎯</div>
                <span>Kill Speed</span>
                Customizable!
            </div>
            <div class="feature-item">
                <div class="feature-icon">🔓</div>
                <span>Keyless</span>
                No Keys Needed!
            </div>
        </div>

        <div class="footer">© 2026 PACKETSTORM PROJECTS</div>
    </div>

</body>
</html>
