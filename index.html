<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just A Baseplate | KAIOD</title>
    
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background: #050508; /* Derin siyah arka plan */
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
            position: relative;
        }

        /* GetWave tarzı grid ve neon arka plan ışımaları */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        .glow-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(0, 255, 136, 0.1);
            filter: blur(120px);
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            z-index: -1;
            animation: pulse 5s infinite alternate;
        }

        .glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(0, 191, 255, 0.1);
            filter: blur(100px);
            bottom: 0;
            right: 10%;
            z-index: -1;
            animation: pulse 7s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Ana Kart */
        .container { 
            background: rgba(10, 10, 15, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            padding: 60px 50px; 
            border-radius: 24px; 
            text-align: center; 
            max-width: 600px; 
            width: 90%; 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8); 
            position: relative; 
            z-index: 10;
            animation: fadeUp 0.8s ease-out;
        }

        /* Neon Başlıklar */
        .game-title { 
            font-size: 3rem; 
            font-weight: 900; 
            letter-spacing: -1px; 
            margin-bottom: 5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ff88, #00e5ff, #00ff88);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        .script-title {
            font-size: 1rem;
            font-weight: 600;
            color: #a1a1aa;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .tagline { 
            color: #d4d4d8; 
            font-size: 1.1rem; 
            margin-bottom: 40px; 
            font-weight: 400; 
            line-height: 1.6; 
        }

        /* GetWave tarzı Havalı Buton */
        .btn-showcase { 
            display: inline-block; 
            width: 100%; 
            padding: 18px 32px; 
            background: linear-gradient(135deg, #00ff88 0%, #00e5ff 100%); 
            color: #050508; 
            font-weight: 800; 
            font-size: 1.1rem; 
            text-decoration: none; 
            border-radius: 16px; 
            transition: all 0.3s ease; 
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 30px;
            border: none;
            cursor: pointer;
        }
        
        .btn-showcase:hover { 
            transform: translateY(-5px) scale(1.02); 
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.6), 0 0 100px rgba(0, 229, 255, 0.4); 
        }

        /* Özellik Kartları */
        .features { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; 
        }
        
        .feature-item { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 20px 15px; 
            border-radius: 16px; 
            font-size: 0.9rem; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            color: #a1a1aa; 
            transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 136, 0.5);
            background: rgba(0, 255, 136, 0.05);
            color: #fff;
        }

        .feature-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.5));
        }

        .feature-item span { 
            color: #00ff88; 
            font-weight: 800; 
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        
        /* Alt Bilgi */
        .footer { 
            margin-top: 40px; 
            font-size: 0.8rem; 
            color: #52525b; 
            letter-spacing: 2px; 
            text-transform: uppercase;
        }

        /* Mobil uyumluluk */
        @media (max-width: 600px) {
            .container { padding: 40px 20px; }
            .game-title { font-size: 2.2rem; }
            .features { grid-template-columns: 1fr; }
            .footer { font-size: 0.7rem; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Arka Plan Neon Işıkları -->
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="container">
        <!-- Oyun ve Script Adı -->
        <h1 class="game-title">Just A Baseplate</h1>
        <p class="script-title">KAIOD Script</p>
        
        <p class="tagline">Next-Gen Roblox Bot Experience. <br>Ultra-fast, keyless and seamless.</p>

        <!-- Havalı CTA Butonu (Linki kendi GitHub'ınla değiştir) -->
        <a href="https://github.com" target="_blank" class="btn-showcase">Get KAIOD</a>
        
        <!-- GetWave tarzı Grid Özellikler -->
        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">⚡</div>
                <span>Speed</span>
                Never Get Lags!
            </div>
            <div class="feature-item">
                <div class="feature-icon">🎯</div>
                <span>Kill Speed</span>
                Customizable!
            </div>
            <div class="feature-item">
                <div class="feature-icon">🔓</div>
                <span>Keyless</span>
                No Keys Needed!
            </div>
        </div>

        <div class="footer">© 2026 PACKETSTORM PROJECTS</div>
    </div>

</body>
</html>
